        </p>

    </main>

    <footer class="site-footer">

        <div class="footer-inner">

            <nav
                class="footer-links"
                aria-label="フッターナビゲーション"
            >

                <a
                    href="https://www.inabata.co.jp/privacy/"
                    target="_blank"
                    rel="noopener noreferrer"

<!-- ==============================
     Cookie Consent
=============================== -->

<div
    id="cookie-banner"
    class="cookie-banner"
    role="dialog"
    aria-labelledby="cookie-title"
    aria-describedby="cookie-description"
    hidden
>

    <div class="cookie-banner-inner">

        <div class="cookie-message">

            <h2 id="cookie-title">
                Cookieの利用について
            </h2>

            <p id="cookie-description">
                当サイトでは、サイトの利用状況の把握等のため
                Cookieを使用する場合があります。
                Cookieの使用について設定できます。
            </p>

            <a
                href="https://www.inabata.co.jp/cookiepolicy"
                target="_blank"
                rel="noopener noreferrer"
                class="cookie-policy-link"
            >
                Cookieポリシー
            </a>

        </div>


        <div class="cookie-actions">

            <button
                type="button"
                id="cookie-reject"
                class="cookie-button cookie-button-secondary"
            >
                拒否する
            </button>

            <button
                type="button"
                id="cookie-accept"
                class="cookie-button cookie-button-primary"
            >
                すべて許可する
            </button>

        </div>

    </div>

</div>
