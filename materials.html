<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>
        Materials | INABATA
    </title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>

    <!-- =====================================
         Header
    ====================================== -->

    <header class="site-header">

        <div class="header-inner">

            <a
                href="./index.html"
                class="site-logo"
                aria-label="INABATA"
            >
                <img
                    id="site-logo-image"
                    src="./assets/images/Iktagline_en_01_RGB.png"
                    alt="INABATA"
                    class="site-logo-image"
                    data-logo-ja="./assets/images/Iktagline_jp_01_RGB.png"
                    data-logo-en="./assets/images/Iktagline_en_01_RGB.png"
                >
            </a>


            <div
                class="language-switcher"
                aria-label="Language"
            >

                <button
                    type="button"
                    class="language-button"
                    data-language="ja"
                >
                    日本語
                </button>

                <span
                    class="language-separator"
                    aria-hidden="true"
                >
                    |
                </span>

                <button
                    type="button"
                    class="language-button"
                    data-language="en"
                >
                    English
                </button>

            </div>

        </div>

    </header>


    <main>

        <!-- =================================
             Hero
        ================================== -->

        <section class="materials-hero">

            <div class="materials-hero-inner">

                <p class="section-label">
                    MATERIALS
                </p>


                <h1
                    class="materials-page-title"
                    data-i18n="materials.title"
                >
                    資料一覧
                </h1>


                <p
                    class="materials-page-description"
                    data-i18n="materials.description"
                >
                    製品・技術・サービスに関する展示会資料をご覧いただけます。
                </p>

            </div>

        </section>


        <!-- =================================
             Materials
        ================================== -->

        <section class="materials-section">

            <div class="materials-section-inner">

                <h2
                    id="materials-heading"
                    class="visually-hidden"
                >
                    Materials
                </h2>


                <!-- Category -->

                <div
                    class="category-filter"
                    aria-label="Material categories"
                >

                    <button
                        type="button"
                        class="category-filter-button"
                        data-category="all"
                        data-i18n="materials.categoryAll"
                    >
                        すべて
                    </button>


                    <button
                        type="button"
                        class="category-filter-button"
                        data-category="electronics"
                        data-i18n="materials.categoryElectronics"
                    >
                        情報電子
                    </button>


                </div>


                <!-- Loading -->

                <p
                    id="materials-loading"
                    class="materials-message"
                    data-i18n="materials.loading"
                >
                    資料を読み込んでいます...
                </p>


                <!-- Error -->

                <p
                    id="materials-error"
                    class="materials-message materials-message-error"
                    hidden
                >
                    資料を読み込めませんでした。
                </p>


                <!-- Empty -->

                <p
                    id="materials-empty"
                    class="materials-empty"
                    data-i18n="materials.empty"
                    hidden
                >
                    該当する資料はありません。
                </p>


                <!-- Grid -->

                <div
                    id="materials-grid"
                    class="materials-grid"
                    aria-live="polite"
                ></div>


                <div class="materials-back">

                    <a
                        href="./index.html"
                        data-i18n="materials.backTop"
                    >
                        ← TOPページへ戻る
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- =====================================
         Footer
    ====================================== -->

<footer class="site-footer">

    <div class="footer-inner">

        <nav
            class="footer-links"
            aria-label="Footer"
        >

            <a
                href="https://www.inabata.co.jp/privacy/"
                data-i18n="footer.privacy"
                data-i18n-href="footer.privacyUrl"
            >
                個人情報保護方針
            </a>


            <a
                href="https://www.inabata.co.jp/privacy/handling.html"
                data-i18n="footer.personalInformation"
                data-i18n-href="footer.personalInformationUrl"
            >
                個人情報の取扱いについて
            </a>


            <a
                href="https://www.inabata.co.jp/cookiepolicy"
                data-i18n="footer.cookie"
                data-i18n-href="footer.cookieUrl"
            >
                Cookieポリシー
            </a>


            <a
                href="https://www.inabata.co.jp/sitepolicy/"
                data-i18n="footer.sitePolicy"
                data-i18n-href="footer.sitePolicyUrl"
            >
                サイトポリシー
            </a>

        </nav>


        <p class="copyright">
            © INABATA &amp; CO., LTD.
        </p>

    </div>

</footer>


    <script src="./js/i18n.js"></script>

    <script src="./js/app.js"></script>

</body>

</html>
