<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Materials | INABATA
    </title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>

    <!-- =====================================
         Header
    ====================================== -->

    <header class="site-header">

        <div class="header-inner">

            <a
                href="./index.html"
                class="site-logo"
                aria-label="INABATA"
            >

                <img
                    src="./assets/inabata-logo.png"
                    alt="INABATA"
                    class="site-logo-image"
                >

            </a>

        </div>

    </header>


    <main>

        <!-- =================================
             Hero
        ================================== -->

        <section class="materials-hero">

            <div class="materials-hero-inner">

                <p class="section-label">
                    MATERIALS
                </p>


                <h1
                    class="materials-page-title"
                    data-i18n="materials.title"
                >
                    資料一覧
                </h1>


                <p
                    class="materials-page-description"
                    data-i18n="materials.description"
                >
                    製品・技術・サービスに関する展示会資料をご覧いただけます。
                </p>

            </div>

        </section>


        <!-- =================================
             Materials
        ================================== -->

        <section class="materials-section">

            <div class="materials-section-inner">

                <h2
                    id="materials-heading"
                    class="visually-hidden"
                >
                    Materials
                </h2>


                <!-- Category -->

                <div
                    class="category-filter"
                    aria-label="Material categories"
                >

                    <button
                        type="button"
                        class="category-filter-button"
                        data-category="all"
                        data-i18n="materials.categoryAll"
                    >
                        すべて
                    </button>


                    <button
                        type="button"
                        class="category-filter-button"
                        data-category="electronics"
                        data-i18n="materials.categoryElectronics"
                    >
                        情報電子
                    </button>


                    <button
                        type="button"
                        class="category-filter-button"
                        data-category="chemicals"
                        data-i18n="materials.categoryChemicals"
                    >
                        化学品
                    </button>


                    <button
                        type="button"
                        class="category-filter-button"
                        data-category="life"
                        data-i18n="materials.categoryLife"
                    >
                        生活産業
                    </button>


                    <button
                        type="button"
                        class="category-filter-button"
                        data-category="plastics"
                        data-i18n="materials.categoryPlastics"
                    >
                        合成樹脂
                    </button>

                </div>


                <!-- Loading -->

                <p
                    id="materials-loading"
                    class="materials-message"
                >
                    資料を読み込んでいます...
                </p>


                <!-- Error -->

                <p
                    id="materials-error"
                    class="materials-message materials-message-error"
                    hidden
                >
                    資料を読み込めませんでした。
                </p>


                <!-- Empty -->

                <p
                    id="materials-empty"
                    class="materials-empty"
                    hidden
                >
                    該当する資料はありません。
                </p>


                <!-- Grid -->

                <div
                    id="materials-grid"
                    class="materials-grid"
                    aria-live="polite"
                ></div>

            </div>

        </section>

    </main>


    <!-- =====================================
         Footer
    ====================================== -->

    <footer class="site-footer">

        <div class="footer-inner">

            <nav
                class="footer-links"
                aria-label="Footer"
            >

                <a href="#">
                    個人情報保護方針
                </a>

                <a href="#">
                    個人情報の取扱いについて
                </a>

                <a href="#">
                    Cookieポリシー
                </a>

                <a href="#">
                    サイトポリシー
                </a>

            </nav>


            <p class="copyright">
                © INABATA &amp; CO., LTD.
            </p>

        </div>

    </footer>


    <script src="./js/i18n.js"></script>

    <script src="./js/app.js"></script>

    <script src="./js/consent.js"></script>

</body>

</html>
