<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Exhibition Materials | INABATA
    </title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>

    <!-- =====================================
         Header
    ====================================== -->

    <header class="site-header">

        <div class="header-inner">

            <a
                href="./index.html"
                class="site-logo"
                aria-label="INABATA"
            >

                <img
                    src="./assets/inabata-logo.png"
                    alt="INABATA"
                    class="site-logo-image"
                >

            </a>

        </div>

    </header>


    <!-- =====================================
         Main
    ====================================== -->

    <main>

        <!-- =================================
             Hero
        ================================== -->

        <section class="hero">

            <div class="hero-inner">

                <p class="hero-en">
                    EXHIBITION MATERIALS
                </p>


                <h1
                    data-i18n="home.title"
                >
                    展示会資料
                </h1>


                <p
                    class="hero-description"
                    data-i18n="home.description"
                >
                    製品・技術・サービスに関する展示会資料をご覧いただけます。
                </p>


                <a
                    href="./materials.html"
                    class="text-link"
                >

                    <span
                        data-i18n="home.viewMaterials"
                    >
                        資料一覧を見る
                    </span>

                    <span
                        aria-hidden="true"
                    >
                        →
                    </span>

                </a>

            </div>

        </section>

    </main>


    <!-- =====================================
         Footer
    ====================================== -->

    <footer class="site-footer">

        <div class="footer-inner">

            <nav
                class="footer-links"
                aria-label="Footer"
            >

                <a
                    href="#"
                    data-i18n="footer.privacy"
                >
                    個人情報保護方針
                </a>


                <a
                    href="#"
                    data-i18n="footer.personalInformation"
                >
                    個人情報の取扱いについて
                </a>


                <a
                    href="#"
                    data-i18n="footer.cookie"
                >
                    Cookieポリシー
                </a>


                <a
                    href="#"
                    data-i18n="footer.sitePolicy"
                >
                    サイトポリシー
                </a>

            </nav>


            <p class="copyright">
                © INABATA &amp; CO., LTD.
            </p>

        </div>

    </footer>


    <!-- =====================================
         Scripts
    ====================================== -->

    <script src="./js/i18n.js"></script>

    <script src="./js/consent.js"></script>

</body>

</html>
