<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>
        Download Material | INABATA
    </title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>

    <!-- =====================================
         Header
    ====================================== -->

    <header class="site-header">

        <div class="header-inner">

            <!-- Logo -->

            <a
                href="./index.html"
                class="site-logo"
                aria-label="INABATA"
            >

                <img
                    id="site-logo-image"
                    src="./assets/images/Iktagline_en_01_RGB.png"
                    alt="INABATA"
                    class="site-logo-image"
                    data-logo-ja="./assets/images/Iktagline_jp_01_RGB.png"
                    data-logo-en="./assets/images/Iktagline_en_01_RGB.png"
                >

            </a>


            <!-- Language Switcher -->

            <div
                class="language-switcher"
                aria-label="Language"
            >

                <button
                    type="button"
                    class="language-button"
                    data-language="ja"
                >
                    日本語
                </button>


                <span
                    class="language-separator"
                    aria-hidden="true"
                >
                    |
                </span>


                <button
                    type="button"
                    class="language-button"
                    data-language="en"
                >
                    English
                </button>

            </div>

        </div>

    </header>


    <!-- =====================================
         Main
    ====================================== -->

    <main>

        <!-- =================================
             Loading
        ================================== -->

        <div
            id="download-page-loading"
            class="download-page-state"
        >

            <span
                data-i18n="download.loading"
            >
                資料情報を読み込んでいます...
            </span>

        </div>


        <!-- =================================
             Page Error
        ================================== -->

        <div
            id="download-page-error"
            class="download-page-state download-page-state-error"
            hidden
        >

            <span
                data-i18n="download.pageError"
            >
                資料情報を取得できませんでした。
            </span>

        </div>


        <!-- =================================
             Content
        ================================== -->

        <div
            id="download-content"
            hidden
        >

            <!-- =============================
                 Hero
            ============================== -->

            <section class="download-hero">

                <div class="download-hero-inner">

                    <p class="section-label">
                        DOWNLOAD
                    </p>


                    <p
                        id="download-category-top"
                        class="download-hero-category"
                    ></p>


                    <h1
                        class="download-page-title"
                        data-i18n="download.title"
                    >
                        資料ダウンロード
                    </h1>


                    <p
                        class="download-page-description"
                        data-i18n="download.description"
                    >
                        資料をご確認のうえ、ダウンロードしてください。
                    </p>

                </div>

            </section>


            <!-- =============================
                 Download Section
            ============================== -->

            <section class="download-section">

                <!-- =========================
                     Main Download Area
                ========================== -->

                <div class="download-inner">

                    <!-- =====================
                         Selected Document
                    ====================== -->

                    <article class="selected-document">

                        <!-- Thumbnail -->

                        <div
                            id="selected-document-visual"
                            class="selected-document-visual"
                        >

                            <img
                                id="selected-document-thumbnail"
                                class="selected-document-thumbnail"
                                alt=""
                                hidden
                            >


                            <!-- PDF Fallback -->

                            <div
                                id="selected-document-pdf"
                                class="selected-document-pdf"
                                aria-hidden="true"
                            >
                                PDF
                            </div>

                        </div>


                        <!-- Document Information -->

                        <div class="selected-document-body">

                            <p class="section-label">
                                SELECTED DOCUMENT
                            </p>


                            <h2
                                id="selected-document-title"
                                class="selected-document-title"
                            ></h2>


                            <p
                                id="selected-document-description"
                                class="selected-document-description"
                            ></p>

                        </div>

                    </article>


                    <!-- =====================
                         Download Action
                    ====================== -->

                    <div class="download-form-area">

                        <h2
                            class="download-form-title"
                            data-i18n="download.actionTitle"
                        >
                            資料のダウンロード
                        </h2>


                        <p
                            class="download-page-description"
                            data-i18n="download.actionDescription"
                        >
                            下のボタンから資料をダウンロードできます。
                        </p>


                        <!-- =================
                             Download Button
                        ================== -->

                        <button
                            type="button"
                            id="download-submit"
                        >

                            <span
                                id="download-submit-label"
                                data-i18n="download.submit"
                            >
                                資料をダウンロード
                            </span>


                            <span
                                aria-hidden="true"
                            >
                                ⇣
                            </span>

                        </button>


                        <!-- =================
                             Processing
                        ================== -->

                        <p
                            id="download-processing"
                            class="download-status"
                            data-i18n="download.processing"
                            aria-live="polite"
                            hidden
                        >
                            ダウンロードを準備しています...
                        </p>


                        <!-- =================
                             Success
                        ================== -->

                        <p
                            id="download-success"
                            class="download-status download-success"
                            data-i18n="download.success"
                            aria-live="polite"
                            hidden
                        >
                            ダウンロードを開始しました。
                        </p>


                        <!-- =================
                             API Error
                        ================== -->

                        <p
                            id="download-error"
                            class="download-api-error"
                            role="alert"
                            aria-live="assertive"
                            hidden
                        ></p>

                    </div>

                </div>


                <!-- =========================
                     Back to Material Detail
                ========================== -->

                <div class="download-back-inner">

                    <div class="download-back">

                        <a
                            id="back-to-material"
                            href="./material.html"
                        >

                            <span
                                data-i18n="download.back"
                            >
                                資料詳細へ戻る
                            </span>

                        </a>

                    </div>

                </div>

            </section>

        </div>

    </main>


    <!-- =====================================
         Footer
    ====================================== -->

    <footer class="site-footer">

        <div class="footer-inner">

            <nav
                class="footer-links"
                aria-label="Footer"
            >

                <a
                    href="https://www.inabata.co.jp/privacy/"
                    data-i18n="footer.privacy"
                    data-i18n-href="footer.privacyUrl"
                >
                    個人情報保護方針
                </a>


                <a
                    href="https://www.inabata.co.jp/privacy/handling.html"
                    data-i18n="footer.personalInformation"
                    data-i18n-href="footer.personalInformationUrl"
                >
                    個人情報の取扱いについて
                </a>


                <a
                    href="https://www.inabata.co.jp/cookiepolicy"
                    data-i18n="footer.cookie"
                    data-i18n-href="footer.cookieUrl"
                >
                    Cookieポリシー
                </a>


                <a
                    href="https://www.inabata.co.jp/sitepolicy/"
                    data-i18n="footer.sitePolicy"
                    data-i18n-href="footer.sitePolicyUrl"
                >
                    サイトポリシー
                </a>

            </nav>


            <p class="copyright">
                © INABATA &amp; CO., LTD.
            </p>

        </div>

    </footer>


    <!-- =====================================
         Scripts
    ====================================== -->

    <!-- i18n -->

    <script src="./js/i18n.js"></script>


    <!-- Download -->

    <script src="./js/download.js"></script>

</body>

</html>
