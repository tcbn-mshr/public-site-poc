<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="展示会資料の詳細をご確認いただけます。"
    >

    <title>資料詳細｜INABATA</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >
</head>


<body>

    <!-- =====================================
         Header
    ====================================== -->

    <header class="site-header">

        <div class="header-inner">

            <a
                href="./index.html"
                class="site-logo"
                aria-label="INABATA トップページ"
            >
                <img
                    src="./assets/images/Iktagline_jp_01_RGB.png"
                    alt="INABATA"
                    class="site-logo-image"
                >
            </a>


            <nav
                class="header-nav"
                aria-label="メインナビゲーション"
            >
                <a href="./materials.html">
                    資料一覧
                </a>
            </nav>

        </div>

    </header>


    <!-- =====================================
         Main
    ====================================== -->

    <main>

        <!-- Loading -->

        <div
            id="material-loading"
            class="material-state-message"
            role="status"
        >
            資料情報を読み込んでいます...
        </div>


        <!-- Error -->

        <div
            id="material-error"
            class="material-state-message"
            role="alert"
            hidden
        >
            <h1>
                資料情報を取得できませんでした。
            </h1>

            <p>
                資料が存在しないか、
                一時的に情報を取得できない状態です。
            </p>

            <p>
                <a
                    href="./materials.html"
                    class="button button-secondary"
                >
                    資料一覧へ戻る
                </a>
            </p>
        </div>


        <!-- Material content -->

        <div
            id="material-content"
            hidden
        >

            <!-- Detail Hero -->

            <section class="material-detail-hero">

                <div class="material-detail-hero-inner">

                    <p class="section-label">
                        MATERIAL DETAIL
                    </p>

                    <p
                        id="material-category-top"
                        class="material-detail-category"
                    ></p>

                    <h1
                        id="material-title-top"
                        class="material-detail-title"
                    ></h1>

                </div>

            </section>


            <!-- Detail Content -->

            <section class="material-detail-section">

                <div class="material-detail-inner">

                    <!-- PDF Visual -->

                    <div class="material-detail-visual">

                        <div
                            class="material-detail-pdf"
                            aria-hidden="true"
                        >
                            PDF
                        </div>

                    </div>


                    <!-- Information -->

                    <div class="material-detail-information">

                        <p class="section-label">
                            DOCUMENT
                        </p>

                        <h2
                            id="material-title"
                            class="material-detail-document-title"
                        ></h2>

                        <p
                            id="material-description"
                            class="material-detail-description"
                        ></p>


                        <a
                            id="material-download-link"
                            href="#"
                            class="button button-primary"
                        >
                            資料をダウンロード
                            <span aria-hidden="true">
                                →
                            </span>
                        </a>

                    </div>

                </div>

            </section>

        </div>

    </main>


    <!-- =====================================
         Footer
    ====================================== -->

    <footer class="site-footer">

        <div class="footer-inner">

            <nav
                class="footer-links"
                aria-label="フッターナビゲーション"
            >

                <a
                    href="https://www.inabata.co.jp/privacy/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    個人情報保護方針
                </a>

                <a
                    href="https://www.inabata.co.jp/privacy/handling.html"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    個人情報の取扱いについて
                </a>

                <a
                    href="https://www.inabata.co.jp/cookiepolicy"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Cookieポリシー
                </a>

                <a
                    href="https://www.inabata.co.jp/sitepolicy/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    サイトポリシー
                </a>

            </nav>


            <p class="copyright">
                &copy; INABATA &amp; CO., LTD.
            </p>

        </div>

    </footer>


    <!-- =====================================
         Cookie Consent
    ====================================== -->

    <div
        id="cookie-banner"
        class="cookie-banner"
        role="dialog"
        aria-labelledby="cookie-title"
        aria-describedby="cookie-description"
        hidden
    >

        <div class="cookie-banner-inner">

            <div class="cookie-message">

                <h2 id="cookie-title">
                    Cookieの利用について
                </h2>

                <p id="cookie-description">
                    当サイトでは、サイトの利用状況の把握等のため
                    Cookieを使用する場合があります。
                    Cookieの使用について設定できます。
                </p>

                <a
                    href="https://www.inabata.co.jp/cookiepolicy"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Cookieポリシー
                </a>

            </div>


            <div class="cookie-actions">

                <button
                    type="button"
                    id="cookie-reject"
                    class="cookie-button cookie-button-secondary"
                >
                    拒否する
                </button>

                <button
                    type="button"
                    id="cookie-accept"
                    class="cookie-button cookie-button-primary"
                >
                    すべて許可する
                </button>

            </div>

        </div>

    </div>


    <!-- =====================================
         JavaScript
    ====================================== -->

    <script src="./js/material.js"></script>
    <script src="./js/consent.js"></script>

</body>

</html>
