<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="View details of the selected exhibition material."
    >

    <title>Material Details | INABATA</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >
</head>


<body>

    <!-- Header -->

    <header class="site-header">

        <div class="header-inner">

            <a
                href="./index.html"
                class="site-logo"
            >
                <img
                    src="./assets/images/Iktagline_jp_01_RGB.png"
                    alt="INABATA"
                    class="site-logo-image"
                >
            </a>


            <nav
                class="header-nav"
                aria-label="Main navigation"
            >
                <a
                    href="./materials.html"
                    data-i18n="nav.materials"
                >
                    Materials
                </a>
            </nav>


            <div
                class="language-switcher"
                aria-label="Language"
            >
                <button
                    type="button"
                    class="language-switcher-button"
                    data-language="ja"
                    aria-pressed="false"
                >
                    日本語
                </button>

                <span
                    class="language-switcher-separator"
                    aria-hidden="true"
                >
                    |
                </span>

                <button
                    type="button"
                    class="language-switcher-button is-active"
                    data-language="en"
                    aria-pressed="true"
                >
                    English
                </button>
            </div>

        </div>

    </header>


    <main>

        <!-- Loading -->

        <div
            id="material-loading"
            class="material-state-message"
            role="status"
            data-i18n="detail.loading"
        >
            Loading material information...
        </div>


        <!-- Error -->

        <div
            id="material-error"
            class="material-state-message"
            role="alert"
            hidden
        >

            <h1 data-i18n="detail.error">
                Unable to load the material information.
            </h1>

            <p>
                <a
                    href="./materials.html"
                    data-i18n="detail.back"
                >
                    Back to Materials
                </a>
            </p>

        </div>


        <!-- Content -->

        <div
            id="material-content"
            hidden
        >

            <section class="material-detail-hero">

                <div class="material-detail-hero-inner">

                    <p
                        class="section-label"
                        data-i18n="detail.label"
                    >
                        MATERIAL DETAIL
                    </p>

                    <p
                        id="material-category-top"
                        class="material-detail-category"
                    ></p>

                    <h1
                        id="material-title-top"
                        class="material-detail-title"
                    ></h1>

                </div>

            </section>


            <section class="material-detail-section">

                <div class="material-detail-inner">

                    <div class="material-detail-visual">

                        <div
                            class="material-detail-pdf"
                            aria-hidden="true"
                        >
                            PDF
                        </div>

                    </div>


                    <div class="material-detail-information">

                        <p
                            class="section-label"
                            data-i18n="detail.document"
                        >
                            DOCUMENT
                        </p>

                        <h2
                            id="material-title"
                            class="material-detail-document-title"
                        ></h2>

                        <p
                            id="material-description"
                            class="material-detail-description"
                        ></p>


                        <a
                            id="material-download-link"
                            href="#"
                            class="button button-primary"
                        >
                            <span data-i18n="detail.download">
                                Download Material
                            </span>

                            <span aria-hidden="true">
                                →
                            </span>
                        </a>

                    </div>

                </div>

            </section>

        </div>

    </main>


    <!-- Footer -->

    <footer class="site-footer">

        <div class="footer-inner">

            <nav
                class="footer-links"
                aria-label="Footer navigation"
            >

                <a
                    href="https://www.inabata.co.jp/privacy/"
                    target="_blank"
                    rel="noopener noreferrer"
                    data-i18n="footer.privacy"
                >
                    Privacy Policy
                </a>

                <a
                    href="https://www.inabata.co.jp/privacy/handling.html"
                    target="_blank"
                    rel="noopener noreferrer"
                    data-i18n="footer.handling"
                >
                    Handling of Personal Information
                </a>

                <a
                    href="https://www.inabata.co.jp/cookiepolicy"
                    target="_blank"
                    rel="noopener noreferrer"
                    data-i18n="footer.cookie"
                >
                    Cookie Policy
                </a>

                <a
                    href="https://www.inabata.co.jp/sitepolicy/"
                    target="_blank"
                    rel="noopener noreferrer"
                    data-i18n="footer.site"
                >
                    Site Policy
                </a>

            </nav>


            <p class="copyright">
                &copy; INABATA &amp; CO., LTD.
            </p>

        </div>

    </footer>


    <script src="./js/i18n.js"></script>
    <script src="./js/material.js"></script>
    <script src="./js/consent.js"></script>

</body>

</html>
