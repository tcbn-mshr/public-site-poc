<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Material | INABATA
    </title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>

    <!-- =====================================
         Header
    ====================================== -->

    <header class="site-header">

        <div class="header-inner">

            <a
                href="./index.html"
                class="site-logo"
                aria-label="INABATA"
            >

                <img
                    src="./assets/inabata-logo.png"
                    alt="INABATA"
                    class="site-logo-image"
                >

            </a>

        </div>

    </header>


    <main>

        <!-- Loading -->

        <div
            id="material-loading"
            class="material-page-state"
        >
            資料情報を読み込んでいます...
        </div>


        <!-- Error -->

        <div
            id="material-error"
            class="material-page-state material-page-state-error"
            hidden
        >
            資料情報を取得できませんでした。
        </div>


        <!-- =================================
             Material
        ================================== -->

        <div
            id="material-content"
            hidden
        >

            <!-- Hero -->

            <section class="material-detail-hero">

                <div class="material-detail-hero-inner">

                    <p class="section-label">
                        MATERIAL DETAIL
                    </p>


                    <p
                        id="material-category-top"
                        class="material-detail-category"
                    ></p>


                    <h1
                        id="material-title-top"
                        class="material-detail-title"
                    ></h1>

                </div>

            </section>


            <!-- Detail -->

            <section class="material-detail-section">

                <div class="material-detail-inner">

                    <!-- Thumbnail -->

                    <div
                        id="material-detail-visual"
                        class="material-detail-visual"
                    >

                        <img
                            id="material-detail-thumbnail"
                            class="material-detail-thumbnail"
                            alt=""
                            hidden
                        >


                        <div
                            id="material-detail-pdf"
                            class="material-detail-pdf"
                            aria-hidden="true"
                        >
                            PDF
                        </div>

                    </div>


                    <!-- Information -->

                    <div class="material-detail-information">

                        <p class="section-label">
                            DOCUMENT
                        </p>


                        <h2
                            id="material-title"
                            class="material-detail-document-title"
                        ></h2>


                        <p
                            id="material-description"
                            class="material-detail-description"
                        ></p>


                        <a
                            id="material-download-link"
                            href="./download.html"
                        >

                            <span
                                data-i18n="material.download"
                            >
                                資料をダウンロード
                            </span>

                            <span
                                aria-hidden="true"
                            >
                                →
                            </span>

                        </a>

                    </div>

                </div>


                <!-- Back to Materials -->

                <div class="material-detail-back-inner">

                    <div class="material-detail-back">

                        <a
                            href="./materials.html"
                            data-i18n="material.back"
                        >
                            ← 資料一覧へ戻る
                        </a>

                    </div>

                </div>

            </section>

        </div>

    </main>


    <!-- =====================================
         Footer
    ====================================== -->

    <footer class="site-footer">

        <div class="footer-inner">

            <nav
                class="footer-links"
                aria-label="Footer"
            >

                <a href="#">
                    個人情報保護方針
                </a>

                <a href="#">
                    個人情報の取扱いについて
                </a>

                <a href="#">
                    Cookieポリシー
                </a>

                <a href="#">
                    サイトポリシー
                </a>

            </nav>


            <p class="copyright">
                © INABATA &amp; CO., LTD.
            </p>

        </div>

    </footer>


    <script src="./js/i18n.js"></script>

    <script src="./js/material.js"></script>

    <script src="./js/consent.js"></script>

</body>

</html>
