<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>資料詳細 | INABATA</title>

    <meta
        name="description"
        content="展示会でご紹介した製品・技術資料の詳細情報です。"
    >

    <link
        rel="stylesheet"
        href="./css/style.css"
    >
</head>

<body>

    <!-- ==============================
         Header
    =============================== -->

    <header class="site-header">
        <div class="header-inner">

            <a class="site-logo" href="./index.html">
                <img
                    class="site-logo-image"
                    src="./assets/images/Iktagline_jp_01_RGB.png"
                    alt="INABATA"
                >
            </a>

            <nav class="header-nav" aria-label="メインナビゲーション">
                <a href="./materials.html">
                    資料一覧
                </a>
            </nav>

        </div>
    </header>


    <main>

        <!-- ==============================
             Page Header
        =============================== -->

        <section class="material-detail-header">

            <div class="content-inner">

                <p class="section-label">
                    MATERIAL DETAIL
                </p>

                <p
                    id="material-category"
                    class="material-detail-category"
                >
                    展示会資料
                </p>

                <h1 id="material-detail-title">
                    資料
                </h1>

            </div>

        </section>


        <!-- ==============================
             Material Detail
        =============================== -->

        <section class="material-detail-section">

            <div class="content-inner">

                <div class="material-detail-layout">


                    <!-- Visual -->

                    <div class="material-detail-visual">

                        <div class="material-detail-pdf">

                            <span>PDF</span>

                        </div>

                    </div>


                    <!-- Information -->

                    <div class="material-detail-content">

                        <p class="section-label">
                            DOCUMENT
                        </p>

                        <h2>
                            製品・技術資料
                        </h2>

                        <p class="material-detail-description">
                            展示会でご紹介した製品・技術資料です。
                            資料の詳細をご確認のうえ、
                            ダウンロードページへお進みください。
                        </p>


                        <!-- Download Page -->

                        <a
                            id="download-page-link"
                            href="./download.html"
                            class="primary-button"
                        >

                            資料をダウンロード

                            <span aria-hidden="true">
                                →
                            </span>

                        </a>

                    </div>

                </div>


                <!-- Back -->

                <div class="material-detail-back">

                    <a href="./materials.html">
                        ← 資料一覧へ戻る
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- ==============================
         Footer
    =============================== -->

    <footer class="site-footer">

        <div class="footer-inner">

            <nav
                class="footer-links"
                aria-label="フッターナビゲーション"
            >

                <a
                    href="https://www.inabata.co.jp/privacy/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    個人情報保護方針
                </a>

                <a
                    href="https://www.inabata.co.jp/privacy/handling.html"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    個人情報の取扱いについて
                </a>

                <a
                    href="https://www.inabata.co.jp/cookiepolicy"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Cookieポリシー
                </a>

                <a
                    href="https://www.inabata.co.jp/sitepolicy/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    サイトポリシー
                </a>

            </nav>

            <p class="copyright">
                &copy; INABATA &amp; CO., LTD.
            </p>

        </div>

    </footer>


    <!-- Material detail control -->

    <script src="./js/material.js"></script>

</body>

</html>
