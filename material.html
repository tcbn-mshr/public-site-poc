<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Material | INABATA
    </title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>

    <!-- =====================================
         Header
    ====================================== -->

    <header class="site-header">

        <div class="header-inner">

            <a
                href="./index.html"
                class="site-logo"
                aria-label="INABATA"
            >
                <img
                    id="site-logo-image"
                    src="./assets/images/Iktagline_en_01_RGB.png"
                    alt="INABATA"
                    class="site-logo-image"
                    data-logo-ja="./assets/images/Iktagline_jp_01_RGB.png"
                    data-logo-en="./assets/images/Iktagline_en_01_RGB.png"
                >
            </a>


            <div
                class="language-switcher"
                aria-label="Language"
            >

                <button
                    type="button"
                    class="language-button"
                    data-language="ja"
                >
                    日本語
                </button>

                <span
                    class="language-separator"
                    aria-hidden="true"
                >
                    |
                </span>

                <button
                    type="button"
                    class="language-button"
                    data-language="en"
                >
                    English
                </button>

            </div>

        </div>

    </header>


    <!-- =====================================
         Main
    ====================================== -->

    <main>

        <!-- =================================
             Loading
        ================================== -->

        <div
            id="material-loading"
            class="material-page-state"
        >

            <span
                data-i18n="material.loading"
            >
                資料情報を読み込んでいます...
            </span>

        </div>


        <!-- =================================
             Error
        ================================== -->

        <div
            id="material-error"
            class="material-page-state material-page-state-error"
            hidden
        >

            <span
                data-i18n="material.error"
            >
                資料情報を取得できませんでした。
            </span>

        </div>


        <!-- =================================
             Content
        ================================== -->

        <div
            id="material-content"
            hidden
        >

            <!-- =============================
                 Hero
            ============================== -->

            <section class="material-detail-hero">

                <div class="material-detail-hero-inner">

                    <p class="section-label">
                        MATERIAL DETAIL
                    </p>


                    <p
                        id="material-category-top"
                        class="material-detail-category"
                    ></p>


                    <h1
                        id="material-title-top"
                        class="material-detail-title"
                    ></h1>

                </div>

            </section>


            <!-- =============================
                 Detail
            ============================== -->

            <section class="material-detail-section">

                <div class="material-detail-inner">

                    <!-- =====================
                         Thumbnail
                    ====================== -->

                    <div
                        id="material-detail-visual"
                        class="material-detail-visual"
                    >

                        <img
                            id="material-detail-thumbnail"
                            class="material-detail-thumbnail"
                            alt=""
                            hidden
                        >


                        <!--
                            Thumbnailが存在しない資料用の
                            PDFフォールバック
                        -->

                        <div
                            id="material-detail-pdf"
                            class="material-detail-pdf"
                            aria-hidden="true"
                        >
                            PDF
                        </div>

                    </div>


                    <!-- =====================
                         Material Information
                    ====================== -->

                    <div class="material-detail-information">

                        <p class="section-label">
                            DOCUMENT
                        </p>


                        <h2
                            id="material-title"
                            class="material-detail-document-title"
                        ></h2>


                        <p
                            id="material-description"
                            class="material-detail-description"
                        ></p>


                        <!-- =================
                             Download
                        ================== -->

                        <a
                            id="material-download-link"
                            href="./download.html"
                        >

                            <span
                                data-i18n="material.download"
                            >
                                資料をダウンロード
                            </span>


                            <span
                                aria-hidden="true"
                            >
                                ⇣
                            </span>

                        </a>

                    </div>

                </div>


                <!-- =========================
                     Back to Materials
                ========================== -->

                <div class="material-detail-back-inner">

                    <div class="material-detail-back">

                        <a
                            href="./materials.html"
                        >

                            <span
                                data-i18n="material.back"
                            >
                                資料一覧へ戻る
                            </span>

                        </a>

                    </div>

                </div>

            </section>

        </div>

    </main>


    <!-- =====================================
         Footer
    ====================================== -->

<footer class="site-footer">

    <div class="footer-inner">

        <nav
            class="footer-links"
            aria-label="Footer"
        >

            <a
                href="https://www.inabata.co.jp/privacy/"
                data-i18n="footer.privacy"
                data-i18n-href="footer.privacyUrl"
            >
                個人情報保護方針
            </a>


            <a
                href="https://www.inabata.co.jp/privacy/handling.html"
                data-i18n="footer.personalInformation"
                data-i18n-href="footer.personalInformationUrl"
            >
                個人情報の取扱いについて
            </a>


            <a
                href="https://www.inabata.co.jp/cookiepolicy"
                data-i18n="footer.cookie"
                data-i18n-href="footer.cookieUrl"
            >
                Cookieポリシー
            </a>


            <a
                href="https://www.inabata.co.jp/sitepolicy/"
                data-i18n="footer.sitePolicy"
                data-i18n-href="footer.sitePolicyUrl"
            >
                サイトポリシー
            </a>

        </nav>


        <p class="copyright">
            © INABATA &amp; CO., LTD.
        </p>

    </div>

</footer>


    <!-- =====================================
         Scripts
    ====================================== -->

    <!-- i18n を先に読み込み -->

    <script src="./js/i18n.js"></script>


    <!-- Material Detail -->

    <script src="./js/material.js"></script>


    <!-- Cookie Consent -->

    <script src="./js/consent.js"></script>

</body>

</html>
